[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chunk-experiment"
version = "0.2.0"
description = "Reproducible text chunking experiments for RAG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "chunk_experiment contributors"}]
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
http = ["requests>=2.31,<3"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
legacy = [
  "requests",
  "pandas",
  "SentencePiece==0.1.99",
  "transformers==4.33.0",
  "Werkzeug==3.0.0",
  "lingua-language-detector==2.0.2",
  "jieba",
  "scikit-learn",
  "lxml",
  "beautifulsoup4",
  "html2image",
  "matplotlib",
  "seaborn",
]

[project.scripts]
chunk-experiment = "chunk_experiment.cli:main"

[tool.setuptools.packages.find]
include = ["chunk_experiment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
