[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chunk-experiment"
version = "0.2.0"
description = "Reproducible RAG chunking experiments and span-based retrieval evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "chunk_experiment contributors"}]
dependencies = []

[project.optional-dependencies]
legacy = [
  "requests>=2.31",
  "numpy>=1.24",
  "pandas>=2.0",
  "sentencepiece>=0.1.99",
  "transformers>=4.33,<5",
  "lingua-language-detector>=2,<3",
  "jieba>=0.42",
  "scikit-learn>=1.3",
  "lxml>=4.9",
  "beautifulsoup4>=4.12",
  "html2image>=2.0",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
chunk-exp = "chunk_experiment.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["chunk_experiment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
