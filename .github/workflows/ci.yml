name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check chunk_experiment tests experiments
      - run: pytest
      - name: Hybrid parent-child retrieval gate
        run: |
          chunk-retrieval-eval examples/retrieval_eval/golden.json \
            --chunker markdown \
            --chunk-size 12 \
            --parent-chunk-size 40 \
            --retrieval-mode hybrid \
            --contextual-headings \
            --top-k 1 3 \
            --gate-k 3 \
            --min-hit-rate 1.0 \
            --min-span-recall 1.0 \
            --output /tmp/retrieval_eval_v4.json
