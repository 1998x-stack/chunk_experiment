name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check chunk_experiment tests experiments/run_factory.py experiments/visualize_factory.py
      - run: pytest
      - name: Smoke test factory evaluation
        run: |
          python experiments/run_factory.py \
            --manifest benchmarks/fixtures/manifest.jsonl \
            --dataset-root benchmarks/fixtures/documents \
            --gold benchmarks/fixtures/gold.jsonl \
            --config configs/factory_smoke.json \
            --output-dir runs/ci-smoke
